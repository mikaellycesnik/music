<script>
    function favoritar(botao) {
        // Alterna entre estrela vazia e cheia
        if (botao.textContent === '⭐') {
            botao.textContent = '🌟';
            botao.style.color = '#FFD700';
            botao.style.transform = 'scale(1.3)';
            alert('🌟 Música favoritada!');
        } else {
            botao.textContent = '⭐';
            botao.style.color = '#FFD700';
            botao.style.transform = 'scale(1)';
            alert('💔 Música desfavoritada!');
        }
    }
</script>
